---
substitutions:
  device_name: athom-mini-5
  friendly_name: "Basement SW 1"
  area: "Game Room"
  static_ip: 192.168.7.88

packages:
  common: !include templates/common.yaml
  actions: !include templates/components/device-action.yaml
  device: !include templates/athom-mini-light.yaml

script:
  - id: !extend on_single
    then:
      - if:
          condition:
            lambda: 'return id(relay_light).current_values.is_on();'
          then:
            - event.trigger:
                id: device_action
                event_type: relay_on
          else:
            - event.trigger:
                id: device_action
                event_type: relay_off
