---
# Shelly EM
# - https://devices.esphome.io/devices/shelly-em/
# - https://templates.blakadder.com/shelly_EM.html
# WARNING: The digital ground may be connected to mains voltage.
# Never connect a serial adapter while the device is powered from mains.

substitutions:
  device_name: shelly-em
  friendly_name: "Power Meter"
  area: "Utility Room"
  static_ip: 192.168.7.19
  fallback_ap_channel: "6"
  sample_rate: "1s"
  update_interval_fast: "20s"
  update_interval_slow: "60s"

  # 120A clamp (3000:1): 1.143207411 - https://community.home-assistant.io/t/anyone-using-shelly-em/149867/14
  # Phase 2 derived from 20 samples from Shelly 1 Plus PM on Fridge: 1.1059
  scale_a_power: '1.1059'
  scale_b_power: '1.1059'

packages:
  common: !include templates/common.yaml
  time: !include templates/components/homeassistant-time.yaml

esp8266:
  board: esp12e

i2c:
  sda: GPIO12
  scl: GPIO14

sensor:
  - platform: ade7953_i2c
    irq_pin: GPIO13
    update_interval: $sample_rate
    use_accumulated_energy_registers: true
    voltage:
      name: Voltage
      id: voltage
      filters:
        - throttle_average: $update_interval_slow
        - round_to_multiple_of: 0.1
        - delta: 0.5
    current_a:
      name: Phase 1 Current
      id: current_phase_1
      filters:
        - or:
          - delta:
              min_value: 0.42
              baseline: !lambda return id(current_phase_1).state;
          - throttle_average: $update_interval_fast
        - round_to_multiple_of: 0.01
        - delta: 0.10
    current_b:
      name: Phase 2 Current
      id: current_phase_2
      filters:
        - or:
          - delta:
              min_value: 0.42
              baseline: !lambda return id(current_phase_2).state;
          - throttle_average: $update_interval_fast
        - round_to_multiple_of: 0.01
        - delta: 0.10
    active_power_a:
      id: raw_power_phase_1
      internal: true
      filters:
        - multiply: $scale_a_power
      on_value:
        - component.update: raw_total_power
    active_power_b:
      id: raw_power_phase_2
      internal: true
      filters:
        - multiply: $scale_b_power
      on_value:
        - component.update: raw_total_power

  - platform: copy
    source_id: raw_power_phase_1
    name: Phase 1 Power
    id: power_phase_1
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - or:
        - delta:
            min_value: 25.0
            baseline: !lambda return id(power_phase_1).state;
        - throttle_average: $update_interval_fast
      - round_to_multiple_of: 1.0
      - delta: 5.0

  - platform: copy
    source_id: raw_power_phase_2
    name: Phase 2 Power
    id: power_phase_2
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - or:
        - delta:
            min_value: 25.0
            baseline: !lambda return id(power_phase_2).state;
        - throttle_average: $update_interval_fast
      - round_to_multiple_of: 1.0
      - delta: 5.0

  # Integrate the unthrottled sum, independently of phase energy publication.
  - platform: template
    id: raw_total_power
    internal: true
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    lambda: |-
      if (isnan(id(raw_power_phase_1).state) ||
          isnan(id(raw_power_phase_2).state)) {
        return {};
      }
      return id(raw_power_phase_1).state + id(raw_power_phase_2).state;
    update_interval: never

  - platform: copy
    source_id: raw_total_power
    name: Total Power
    id: total_power
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - or:
        - delta:
            min_value: 25.0
            baseline: !lambda return id(total_power).state;
        - throttle_average: $update_interval_fast
      - round_to_multiple_of: 1.0
      - delta: 2.0

  - platform: total_daily_energy
    name: Phase 1 Daily Energy
    id: energy_phase_1
    power_id: raw_power_phase_1
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    method: trapezoid
    restore: false
    filters:
      - multiply: 0.001
      - throttle: $update_interval_slow

  - platform: total_daily_energy
    name: Phase 2 Daily Energy
    id: energy_phase_2
    power_id: raw_power_phase_2
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    method: trapezoid
    restore: false
    filters:
      - multiply: 0.001
      - throttle: $update_interval_slow

  - platform: total_daily_energy
    name: Total Daily Energy
    id: total_energy
    power_id: raw_total_power
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    method: trapezoid
    restore: false
    filters:
      - multiply: 0.001
      - throttle: $update_interval_slow

status_led:
  pin:
    number: GPIO0
    inverted: yes
