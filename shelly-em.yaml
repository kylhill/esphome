---
# Shelly EM
# - https://devices.esphome.io/devices/shelly-em/
# - https://templates.blakadder.com/shelly_EM.html
# WARNING: The digital ground may be connected to mains voltage.
# Never connect a serial adapter while the device is powered from mains.

substitutions:
  device_name: shelly-em
  friendly_name: "Power Meter"
  area: "Utility Room"
  static_ip: 192.168.7.19
  fallback_ap_channel: "6"
  sample_rate: "1s"
  update_interval: "30s"

  # 120A clamp (3000:1): 1.143207411 - https://community.home-assistant.io/t/anyone-using-shelly-em/149867/14
  # Phase 2 derived from 20 samples from Shelly 1 Plus PM on Fridge: 1.1059
  scale_a_power: '1.1059'
  scale_b_power: '1.1059'

packages:
  common: !include templates/common.yaml
  time: !include templates/components/homeassistant-time.yaml

esp8266:
  board: esp12e

i2c:
  sda: GPIO12
  scl: GPIO14

sensor:
  - platform: ade7953_i2c
    irq_pin: GPIO13
    update_interval: $sample_rate
    use_accumulated_energy_registers: true
    voltage:
      name: Voltage
      accuracy_decimals: 1
      id: voltage
      filters:
        - throttle_average: $update_interval
        - round_to_multiple_of: 0.1
        - delta: 0.5
    current_a:
      name: Phase 1 Current
      accuracy_decimals: 2
      id: current_phase_1
      filters:
        - throttle_average: $update_interval
        - round_to_multiple_of: 0.01
        - delta: 0.0167
    current_b:
      name: Phase 2 Current
      accuracy_decimals: 2
      id: current_phase_2
      filters:
        - throttle_average: $update_interval
        - round_to_multiple_of: 0.01
        - delta: 0.0167
    active_power_a:
      id: raw_power_phase_1
      internal: true
      filters:
        - multiply: $scale_a_power
    active_power_b:
      id: raw_power_phase_2
      internal: true
      filters:
        - multiply: $scale_b_power
      on_value:
        # The ADE7953 publishes phase A before phase B in each poll.
        - component.update: raw_total_power

  - platform: copy
    source_id: raw_power_phase_1
    name: Phase 1 Power
    accuracy_decimals: 0
    id: power_phase_1
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - !include
          file: templates/components/delta-average-filter.yaml
          vars: &power_filter_vars
            delta_threshold: 25.0
            delta_average_seconds: 5
            average_seconds: 30
            average_fallback_seconds: 180
            rounding_step: 1.0
            average_deadband: 2.0
            delta_on_confirmed_zero: "false"

  - platform: copy
    source_id: raw_power_phase_2
    name: Phase 2 Power
    accuracy_decimals: 0
    id: power_phase_2
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - !include
          file: templates/components/delta-average-filter.yaml
          vars: *power_filter_vars

  # Integrate the unthrottled sum, independently of phase energy publication.
  - platform: template
    id: raw_total_power
    internal: true
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    lambda: |-
      if (isnan(id(raw_power_phase_1).state) ||
          isnan(id(raw_power_phase_2).state)) {
        return {};
      }
      return id(raw_power_phase_1).state + id(raw_power_phase_2).state;
    update_interval: never

  - platform: copy
    source_id: raw_total_power
    name: Total Power
    accuracy_decimals: 0
    id: total_power
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - !include
          file: templates/components/delta-average-filter.yaml
          vars: *power_filter_vars

  - platform: total_daily_energy
    name: Phase 1 Daily Energy
    id: energy_phase_1
    power_id: raw_power_phase_1
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    # ADE7953 power is the average over the interval that just ended.
    method: right
    restore: false
    filters:
      - multiply: 0.001
      - throttle: $update_interval

  - platform: total_daily_energy
    name: Phase 2 Daily Energy
    id: energy_phase_2
    power_id: raw_power_phase_2
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    method: right
    restore: false
    filters:
      - multiply: 0.001
      - throttle: $update_interval

  - platform: total_daily_energy
    name: Total Daily Energy
    id: total_energy
    power_id: raw_total_power
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    method: right
    restore: false
    filters:
      - multiply: 0.001
      - throttle: $update_interval

status_led:
  pin:
    number: GPIO0
    inverted: yes
