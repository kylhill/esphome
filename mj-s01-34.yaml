---
substitutions:
  device_name: mj-s01-34
  friendly_name: "Utility Room SW 1"
  area: "Utility Room"
  static_ip: 192.168.7.87
  button_template: components/mj-s01-button-single.yaml

packages:
  common: !include templates/common.yaml
  actions: !include templates/components/device-action.yaml
  device: !include templates/mj-s01-light.yaml

script:
  - id: !extend on_single
    then:
      - if:
          condition:
            lambda: 'return id(relay_light).current_values.is_on();'
          then:
            - event.trigger:
                id: device_action
                event_type: relay_on
          else:
            - event.trigger:
                id: device_action
                event_type: relay_off
