---
# Martin Jerry MJ-ST02 3-Way Switch
# - https://esphome.io/components/tuya.html
# - https://community.home-assistant.io/t/martin-jerry-st02-3-way-tasmota-switch/536416
# - https://github.com/joshuaboniface/martinjerry-esphome/blob/master/mj-st02/mj-st02.yaml
substitutions:
  device_icon: "mdi:lightbulb"
  fallback_ap_channel: "6"

esp8266:
  board: esp12e
  restore_from_flash: true
  early_pin_init: false

uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

# https://developer.tuya.com/en/docs/iot/smart-switch-product-function-definition?id=K9r7gh4lbe886
# Tuya:
#    Datapoint 1: switch (value: OFF)   - Relay control
#    Datapoint 7: int value (value: 0)  - Countdown timer
#    Product: '{"p":"aici5lcchyjapfve","v":"1.1.0","m":2}'
tuya:

light:
  - platform: tuya
    name: None
    icon: $device_icon
    switch_datapoint: 1
    restore_state: all
