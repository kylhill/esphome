---
# Shelly 1 - Garage Door Opener
# - https://savjee.be/2020/06/make-garage-door-opener-smart-shelly-esphome-home-assistant/
# - https://github.com/athom-tech/athom-configs/blob/main/athom-garage-door.yaml
substitutions:
  fallback_ap_channel: "6"

esp8266:
  board: esp01_1m
  early_pin_init: false

binary_sensor:
  - platform: gpio
    id: contact_sensor
    pin:
      number: GPIO5
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on_off: 50ms

switch:
  - platform: gpio
    id: relay_switch
    internal: true
    pin: GPIO4
    restore_mode: ALWAYS_OFF

script:
  - id: pulse_relay
    mode: single
    then:
      - switch.turn_on: relay_switch
      - delay: 250ms
      - switch.turn_off: relay_switch

cover:
  - platform: template
    name: None
    device_class: garage
    lambda: "return id(contact_sensor).state ? COVER_OPEN : COVER_CLOSED;"
    open_action:
      - script.execute: pulse_relay
    close_action:
      - script.execute: pulse_relay
    stop_action:
      - script.execute: pulse_relay
