---
# Shelly 1 - Light
packages:
  parent: !include shelly-1-base.yaml

substitutions:
  device_icon: "mdi:lightbulb"

output:
  - platform: gpio
    id: relay_output
    pin: GPIO4

binary_sensor:
  - platform: gpio
    id: the_switch
    pin:
      number: GPIO5
    on_state:
      then:
        - light.toggle: relay_light
    filters:
      - delayed_on_off: 25ms

light:
  - platform: binary
    id: relay_light
    name: None
    icon: $device_icon
    output: relay_output
    restore_state: all
