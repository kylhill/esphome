---
# CSE7766 Power Sensor
# - https://esphome.io/components/sensor/cse7766.html
# WARNING: The Sonoff S31 digital ground is connected to mains voltage.
# Never connect a serial adapter while the device is powered from mains.
substitutions:
  update_interval: "60s"

packages:
  time: !include homeassistant-time.yaml

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

sensor:
  - platform: cse7766
    current:
      id: current
      name: Current
      device_class: current
      state_class: measurement
      filters:
        - or:
          - delta:
              min_value: 0.17
              baseline: !lambda return id(current).state;
          - throttle_average: $update_interval
        - round_to_multiple_of: 0.01
        - delta: 0.0
    voltage:
      id: voltage
      name: Voltage
      device_class: voltage
      state_class: measurement
      filters:
        - throttle_average: $update_interval
        - round_to_multiple_of: 0.1
        - delta: 0.5
    power:
      id: raw_power
      internal: true

  - platform: copy
    source_id: raw_power
    id: power
    name: Power
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - or:
        - delta:
            min_value: 5.0
            baseline: !lambda return id(power).state;
        - throttle_average: $update_interval
      - round_to_multiple_of: 0.1
      - delta: 0.0

  - platform: total_daily_energy
    name: Total Daily Energy
    state_class: total_increasing
    power_id: raw_power
    device_class: energy
    method: trapezoid
    restore: false
    unit_of_measurement: kWh
    filters:
      - multiply: 0.001
      - throttle: $update_interval
