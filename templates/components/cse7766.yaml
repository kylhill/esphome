---
# CSE7766 Power Sensor
# - https://esphome.io/components/sensor/cse7766.html
# WARNING: The Sonoff S31 digital ground is connected to mains voltage.
# Never connect a serial adapter while the device is powered from mains.
substitutions:
  update_interval: "60s"

packages:
  time: !include homeassistant-time.yaml

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

sensor:
  - platform: cse7766
    current:
      id: current
      name: Current
      accuracy_decimals: 3
      device_class: current
      state_class: measurement
      filters:
        - throttle_average: $update_interval
        - round_to_multiple_of: 0.001
        - delta: 0.0025
    voltage:
      id: voltage
      name: Voltage
      accuracy_decimals: 1
      device_class: voltage
      state_class: measurement
      filters:
        - throttle_average: $update_interval
        - round_to_multiple_of: 0.1
        - delta: 0.5
    power:
      id: raw_power
      internal: true

  - platform: copy
    source_id: raw_power
    id: power
    name: Power
    accuracy_decimals: 1
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - !include
          file: delta-average-filter.yaml
          vars:
            delta_threshold: 5.0
            delta_average_seconds: 5
            average_seconds: 60
            average_fallback_seconds: 180
            rounding_step: 0.1
            average_deadband: 0.3
            delta_on_confirmed_zero: "true"

  - platform: total_daily_energy
    name: Total Daily Energy
    state_class: total_increasing
    power_id: raw_power
    device_class: energy
    method: trapezoid
    restore: false
    unit_of_measurement: kWh
    filters:
      - multiply: 0.001
      - throttle: $update_interval
