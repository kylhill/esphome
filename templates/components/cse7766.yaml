---
# CSE7766 Power Sensor
# - https://esphome.io/components/sensor/cse7766.html
# WARNING: The Sonoff S31 digital ground is connected to mains voltage.
# Never connect a serial adapter while the device is powered from mains.
packages:
  time: !include homeassistant-time.yaml

esphome:
  on_boot:
    priority: -100
    then:
      - component.update: daily_energy

time:
  - id: !extend ha_time
    on_time:
      - hours: 0
        minutes: 0
        seconds: 0
        then:
          - component.update: daily_energy
    on_time_sync:
      then:
        - component.update: daily_energy

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

sensor:
  - platform: cse7766
    current:
      id: current
      name: Current
      accuracy_decimals: 3
      device_class: current
      state_class: measurement
      filters:
        - throttle_average: 60s
        - round_to_multiple_of: 0.001
        - delta: 0.01
    voltage:
      id: voltage
      name: Voltage
      accuracy_decimals: 1
      device_class: voltage
      state_class: measurement
      filters:
        - throttle_average: 60s
        - round_to_multiple_of: 0.1
        - delta: 0.5
    power:
      id: raw_power
      internal: true
    energy:
      id: native_energy_wh
      internal: true
      on_value:
        - component.update: daily_energy

  - platform: copy
    source_id: raw_power
    id: power
    name: Power
    accuracy_decimals: 1
    state_class: measurement
    device_class: power
    unit_of_measurement: W
    filters:
      - !include
          file: delta-average-filter.yaml
          vars:
            delta_threshold: 5.0
            delta_average_seconds: 2
            average_seconds: 60
            average_fallback_seconds: 180
            rounding_step: 0.1
            average_deadband: 0.5
            delta_on_confirmed_zero: "true"

  - platform: template
    id: daily_energy
    name: Total Daily Energy
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    accuracy_decimals: 4
    update_interval: never
    lambda: |-
      static float day_start_wh = 0.0f;
      static float last_total_wh = 0.0f;
      static int last_date = 0;
      const float native_wh = id(native_energy_wh).state;
      const float total_wh = std::isfinite(native_wh) ? native_wh : last_total_wh;
      // Preserve the day's accumulated energy if the driver's pulse total wraps.
      if (total_wh < last_total_wh)
        day_start_wh -= last_total_wh;
      last_total_wh = total_wh;
      const auto now = id(ha_time).now();
      if (now.is_valid()) {
        const int date = now.year * 1000 + now.day_of_year;
        // Keep energy counted before the first time sync, as before.
        if (last_date != 0 && date != last_date)
          day_start_wh = total_wh;
        last_date = date;
      }
      return (total_wh - day_start_wh) * 0.001f;
    filters:
      - lambda: |-
          static uint32_t last_publish_ms = 0;
          static bool published = false;
          const uint32_t now = millis();

          if (!std::isfinite(x))
            return {};

          // Detect actual resets before rounding.
          const bool reset = x == 0.0f;

          // Round published energy to 0.1 Wh.
          x = roundf(x * 10000.0f) / 10000.0f;

          if (published && x == id(daily_energy).state)
            return {};

          if (!published || reset || now - last_publish_ms >= 180000UL) {
            last_publish_ms = now;
            published = true;
            return x;
          }

          return {};
