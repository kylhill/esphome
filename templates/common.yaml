---
# Common configuration for all devices
esphome:
  name: $device_name
  friendly_name: $friendly_name
  area: $area

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

safe_mode:

debug:

#network:
#  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .iot.tacomafia.net
  power_save_mode: HIGH
  min_auth_mode: WPA2

  ap:
    password: !secret ap_password
    ap_timeout: 5min

  manual_ip:
    static_ip: $static_ip
    gateway: 192.168.7.1
    subnet: 255.255.255.0
    dns1: 192.168.7.1

captive_portal:

button:
  - platform: restart
    id: restart_button
    name: Restart

  - platform: safe_mode
    name: Restart (Safe Mode)

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5min

  - platform: wifi_signal
    name: Wi-Fi RSSI
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5min

text_sensor:
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic
    disabled_by_default: true
    hide_timestamp: true

  - platform: debug
    reset_reason:
      name: Reset Reason
      entity_category: diagnostic
      disabled_by_default: true
