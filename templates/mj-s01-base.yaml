---
# Martin Jerry MJ-S01
# - https://devices.esphome.io/devices/MJ-S01
# - https://digiblur.com/wiki/devices/switches/martin_jerry_mj-s01_single_pole
substitutions:
  button_template: components/mj-s01-button-multi.yaml
  click_short: 250ms
  click_single_max: 749ms
  click_long: 750ms
  flash_delay: 200ms

packages:
  button: !include ${button_template}

globals:
  - id: red_on
    type: bool
    initial_value: 'false'
  - id: blue_on
    type: bool
    initial_value: 'false'

script:
  - id: on_single
    then: {}

  - id: on_double
    then: {}

  - id: on_long
    then: {}

  - id: flash_purple
    then:
      - lambda: |-
          id(red_on) = id(red_led).current_values.is_on();
          id(blue_on) = id(blue_led).current_values.is_on();
      - light.turn_on: red_led
      - light.turn_on: blue_led
      - delay: $flash_delay
      - light.turn_off: red_led
      - light.turn_off: blue_led
      - delay: $flash_delay
      - light.turn_on: red_led
      - light.turn_on: blue_led
      - delay: $flash_delay
      - light.turn_off: red_led
      - light.turn_off: blue_led
      - delay: $flash_delay
      - if:
          condition:
            lambda: 'return id(red_on);'
          then:
            - light.turn_on: red_led
          else:
            - light.turn_off: red_led
      - if:
          condition:
            lambda: 'return id(blue_on);'
          then:
            - light.turn_on: blue_led
          else:
            - light.turn_off: blue_led

esp8266:
  board: esp01_1m
  restore_from_flash: true
  early_pin_init: false

output:
  - platform: gpio
    id: relay_output
    pin: GPIO12

  - platform: gpio
    id: red_output
    pin:
      number: GPIO4
      inverted: true

  - platform: gpio
    id: blue_output
    pin:
      number: GPIO5
      inverted: true

# https://github.com/KaufHA/kauf-rgb-switch/blob/main/kauf-rgbs.yaml
binary_sensor:
  - platform: gpio
    id: the_switch
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 25ms

light:
  - platform: binary
    id: red_led
    output: red_output

  - platform: binary
    id: blue_led
    output: blue_output
