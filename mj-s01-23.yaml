---
substitutions:
  device_name: mj-s01-23
  friendly_name: "Living Room SW 5"
  area: "Outside"
  static_ip: 192.168.7.72
  fallback_ap_channel: "6"

packages:
  common: !include templates/common.yaml
  actions: !include templates/components/device-action.yaml
  device: !include templates/mj-s01-light.yaml

script:
  - id: !extend on_single
    then:
      - if:
          condition:
            lambda: 'return id(relay_light).current_values.is_on();'
          then:
            - event.trigger:
                id: device_action
                event_type: relay_on
          else:
            - event.trigger:
                id: device_action
                event_type: relay_off

  - id: !extend on_double
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - event.trigger:
                id: device_action
                event_type: double_click
            - script.execute: flash_purple
          else:
            - script.execute: flash_action_error

  - id: !extend on_long
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - event.trigger:
                id: device_action
                event_type: long_press
            - script.execute: flash_purple
          else:
            - script.execute: flash_action_error
